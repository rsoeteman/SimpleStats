name: Build & Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write # required for NuGet Trusted Publishing

jobs:
  build:
    runs-on: windows-latest
    outputs:
      nuGetVersion: ${{ steps.gitversion.outputs.nuGetVersion }}

    env:
      BUILD_CONFIGURATION: Release
      BUILD_PLATFORM: Any CPU

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set branch variables
        id: vars
        shell: pwsh
        run: |
          $branch = "${{ github.ref }}"
          $isMain = $branch -like "refs/heads/main"
          $isTag = $branch -like "refs/tags/*"

          $shouldPreRelease = $isMain -or $isTag
          $shouldReleaseToNuget = $isTag -or ("${{ vars.PushToNugetOrg }}" -eq "true")

          echo "Owner: ${{ github.repository_owner }}"
          echo "isMain=$isMain" >> $env:GITHUB_OUTPUT
          echo "isTag=$isTag" >> $env:GITHUB_OUTPUT
          echo "shouldPreRelease=$shouldPreRelease" >> $env:GITHUB_OUTPUT
          echo "shouldReleaseToNuget=$shouldReleaseToNuget" >> $env:GITHUB_OUTPUT

      - name: Print variables
        run: |
          echo "Is main branch ${{ steps.vars.outputs.isMain }}"
          echo "Is Tag ${{ steps.vars.outputs.isTag }}"
          echo "Create NuGet package ${{ steps.vars.outputs.shouldPreRelease }}"
          echo "Push to NuGet.org ${{ steps.vars.outputs.shouldReleaseToNuget }}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET version
        run: dotnet --version

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Show Umbraco version used by tests
        shell: pwsh
        run: dotnet list tests/SimpleStats.Tests package | Select-String "Umbraco.Cms"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - name: NPM Install
        working-directory: ./src/SimpleStats.Client
        run: npm ci

      - name: NPM Build
        working-directory: ./src/SimpleStats.Client
        run: npm run build

      - name: Run tests
        run: dotnet test --configuration Release --no-restore

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0
        with:
          versionSpec: '5.10.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0
        with:
          useConfigFile: true
          configFilePath: Automation/GitVersion.yml

      # E2E: provisions a throwaway Umbraco 18 SQLite site with SimpleStats installed and runs the
      # Playwright suite in tests/SimpleStats.E2ETests against it. A failing E2E test fails this
      # job, so a tagged build never reaches the NuGet push below.
      - name: Ensure ASP.NET Core dev HTTPS certificate exists
        run: dotnet dev-certs https

      - name: E2E - NPM Install
        working-directory: ./tests/SimpleStats.E2ETests
        run: npm ci

      - name: E2E - Install Playwright browsers
        working-directory: ./tests/SimpleStats.E2ETests
        run: npm run install:browsers

      - name: E2E - Run Playwright tests
        working-directory: ./tests/SimpleStats.E2ETests
        timeout-minutes: 20
        env:
          SIMPLESTATS_VERSION: ${{ steps.gitversion.outputs.nuGetVersion }}
          # The "NPM Build" step above already built the backoffice assets.
          E2E_SKIP_CLIENT_BUILD: '1'
          # Keeps the throwaway site folder (the process is still stopped) so the step below can
          # upload its logs. The runner is discarded after the job anyway.
          E2E_KEEP_SITE: '1'
          # Puts the throwaway site under a known folder for the log upload below.
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        # A trace for every failed test (console errors, network, DOM snapshots), not only on retry.
        run: npm test -- --trace=retain-on-failure

      # The site's own console output and Umbraco log: the place to look when the site never
      # reaches a usable state.
      - name: E2E - Upload site logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-site-logs
          path: |
            ${{ runner.temp }}/SimpleStatsE2E/*/e2e-site*.log
            ${{ runner.temp }}/SimpleStatsE2E/*/umbraco/Logs/
          if-no-files-found: ignore

      - name: E2E - Generate e2e summary
        if: always()
        working-directory: ./tests/SimpleStats.E2ETests
        env:
          SIMPLESTATS_VERSION: ${{ steps.gitversion.outputs.nuGetVersion }}
        run: node scripts/generate-e2e-summary.mjs

      - name: E2E - Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-report
          retention-days: 7
          path: |
            tests/SimpleStats.E2ETests/playwright-report/
            tests/SimpleStats.E2ETests/test-results/
          if-no-files-found: ignore

      - name: E2E - Upload Playwright report for GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: tests/SimpleStats.E2ETests/playwright-report/

      - name: Update umbraco-package.json
        shell: pwsh
        run: |
          $file = "./src/SimpleStats.Client/wwwroot/App_Plugins/SimpleStats/umbraco-package.json"
          (Get-Content $file -Raw) -replace '"version": ".*"', '"version": "${{ steps.gitversion.outputs.nuGetVersion }}"' | Set-Content $file

      - name: Pack NuGet
        run: dotnet pack --configuration Release -p:Version=${{ steps.gitversion.outputs.nuGetVersion }} -p:PackageVersion=${{ steps.gitversion.outputs.nuGetVersion }} --output ./artifacts

      - name: NuGet login (OIDC → temp API key)
        if: github.event_name != 'pull_request' && steps.vars.outputs.shouldReleaseToNuget == 'True'
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        if: github.event_name != 'pull_request' && steps.vars.outputs.shouldReleaseToNuget == 'True'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem "./artifacts/*.nupkg" | ForEach-Object {
            dotnet nuget push $_.FullName --source "https://api.nuget.org/v3/index.json" --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to push $($_.Name) (exit code $LASTEXITCODE)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  publish-e2e-report:
    # Publishes the Playwright HTML report and the plain-language summary.html to GitHub Pages, so
    # results are one click away instead of a zip download. Deploys even when the E2E tests failed
    # (that's usually exactly when you want to read it) as long as the run wasn't cancelled.
    # If `build` fails before it reaches the E2E steps, no Pages artifact exists and this job fails
    # too - re-run once the earlier failure is fixed.
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy E2E report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add report links to job summary
        run: |
          echo "## SimpleStats ${{ needs.build.outputs.nuGetVersion }} (Umbraco 18)" >> "$GITHUB_STEP_SUMMARY"
          echo "### 📋 E2E summary: ${{ steps.deployment.outputs.page_url }}summary.html" >> "$GITHUB_STEP_SUMMARY"
          echo "### 🎭 Full Playwright report: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
